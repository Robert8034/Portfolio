            <h1 data-nl="Consultant Software Engineer (Tech Lead)" data-en="Consultant Software Engineer (Tech Lead)"></h1>
            <p class="exp-period-label">05/2023 – 02/2024</p>
        </div>
    </header>

    <main>
        <section class="exp-section">
            <div class="exp-block">
                <h2 data-nl="Situatie" data-en="Situation"></h2>
                <p data-nl="Baxter is een multinationaal zorgbedrijf. Ik werd als externe consultant ingeschakeld in het softwareteam (4 engineers, 2 testers, 1 architect) dat werkte aan FDS-II, een intern platform voor het beheer van medische productdata. Het platform bestond uit 20 onderling verweven applicaties in C# en Visual Basic, met aanzienlijke technische schuld."
                   data-en="Baxter is a multinational healthcare company. I was brought in as an external consultant to the software team (4 engineers, 2 testers, 1 architect) working on FDS-II, an internal platform for managing medical product data. The platform consisted of 20 tightly coupled applications in C# and Visual Basic, with significant technical debt."></p>
            </div>
            <div class="exp-block">
                <h2 data-nl="Rol & verantwoordelijkheden" data-en="Role & responsibilities"></h2>
                <p data-nl="Begon als ondersteunende developer voor features en bugfixes. Binnen twee maanden gegroeid naar tech lead: ik initieerde de architectuurherziening, voerde code reviews uit, deelde kennis met het team en rapporteerde voortgang aan de architect en stakeholders. Coördineerde het team van 4 engineers gedurende de migratie."
                   data-en="Started as a supporting developer for features and bug fixes. Within two months grew into tech lead: I initiated the architecture revision, conducted code reviews, shared knowledge with the team and reported progress to the architect and stakeholders. Coordinated the team of 4 engineers during the migration."></p>
            </div>
            <div class="exp-block">
                <h2 data-nl="Aanpak" data-en="Approach"></h2>
                <p data-nl="Ik analyseerde de bestaande architectuur en stelde voor de 20 applicaties te consolideren tot 2 kerncomponenten via een nieuwe infrastructuurlaag. Ik ontwierp en implementeerde deze laag zelf, met SignalR voor real-time communicatie tussen applicaties en een .NET API als centraal koppelpunt. Legacy-applicaties werden systematisch gemigreerd. Voortgang werd bijgehouden in sprints met wekelijkse afstemming met de architect."
                   data-en="I analysed the existing architecture and proposed consolidating the 20 applications into 2 core components via a new infrastructure layer. I designed and implemented this layer myself, using SignalR for real-time inter-application communication and a .NET API as a central integration point. Legacy applications were systematically migrated. Progress was tracked in sprints with weekly architect alignment."></p>
            </div>
            <div class="exp-block">
                <h2 data-nl="Resultaat" data-en="Result"></h2>
                <p data-nl="20 applicaties geconsolideerd naar 2 kerncomponenten. Nieuwe FDS-II infrastructuurlaag live gezet. Technische schuld drastisch verminderd: onderhoud en uitbreiding van het platform werden aanzienlijk eenvoudiger. Het team kon na de migratie sneller features leveren doordat de architectuur niet meer in de weg zat."
                   data-en="20 applications consolidated into 2 core components. New FDS-II infrastructure layer deployed to production. Technical debt drastically reduced: maintenance and extension of the platform became significantly simpler. The team could deliver features faster after the migration as the architecture was no longer a bottleneck."></p>
            </div>
        </section>
