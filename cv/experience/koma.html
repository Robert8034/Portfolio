            <h1 data-nl="Consultant Software Engineer" data-en="Consultant Software Engineer"></h1>
            <p class="exp-period-label">09/2022 – 05/2023</p>
        </div>
    </header>

    <main>
        <section class="exp-section">
            <div class="exp-block">
                <h2 data-nl="Situatie" data-en="Situation"></h2>
                <p data-nl="Koma is een Nederlands bedrijf gespecialiseerd in industriele koelinstallaties sinds 1938. Een groot deel van het softwareteam ging met pensioen, waardoor een kritisch kennisgat ontstond rond KControl, een complex besturingssysteem gebouwd in C++ (Qt) en Java dat de koelinstallaties aanstuurt."
                   data-en="Koma is a Dutch company specialising in industrial refrigeration solutions since 1938. A significant part of the software team retired, creating a critical knowledge gap around KControl, a complex control system built in C++ (Qt) and Java that manages the refrigeration units."></p>
            </div>
            <div class="exp-block">
                <h2 data-nl="Rol & verantwoordelijkheden" data-en="Role & responsibilities"></h2>
                <p data-nl="Zelfstandige engineeringrol met directe rapportage aan de directeur. Verantwoordelijk voor het doorgronden, documenteren en stabiliseren van de volledige legacy-codebase. Geen bestaande methodologie of teamstructuur: ik moest zelf het proces inrichten."
                   data-en="Autonomous engineering role with direct reporting to the director. Responsible for understanding, documenting and stabilising the entire legacy codebase. No existing methodology or team structure: I had to set up the process myself."></p>
            </div>
            <div class="exp-block">
                <h2 data-nl="Aanpak" data-en="Approach"></h2>
                <p data-nl="Wat begon als documentatiewerk groeide uit tot een uitgebreide refactoring. Ik identificeerde en dichtte beveiligingslekken (SSL-configuratie, authenticatie), verbeterde prestaties op kritieke plekken en moderniseerde de build-pipeline door Apache Ant te vervangen door Maven. Introduceerde korte iteratiecycli en gestructureerde rapportage waar voorheen geen formeel proces bestond. Schreef IT-documentatie voor veelvoorkomende problemen zodat het resterende team zelfstandig kon troubleshooten."
                   data-en="What began as documentation work evolved into a comprehensive refactoring. I identified and patched security vulnerabilities (SSL configuration, authentication), improved performance at critical points and modernised the build pipeline by replacing Apache Ant with Maven. Introduced short iteration cycles and structured reporting where no formal process existed before. Wrote IT documentation for common issues so the remaining team could troubleshoot independently."></p>
            </div>
            <div class="exp-block">
                <h2 data-nl="Resultaat" data-en="Result"></h2>
                <p data-nl="Volledige KControl-codebase gedocumenteerd en gestabiliseerd. Beveiligingslekken gedicht en prestatieverbeteringen doorgevoerd die de betrouwbaarheid van de koelbesturing verhoogden. Het IT-team uitgerust met handleidingen, waardoor hun afhankelijkheid van externe ondersteuning significant daalde. Build-pipeline gemoderniseerd van Ant naar Maven."
                   data-en="Full KControl codebase documented and stabilised. Security vulnerabilities patched and performance improvements implemented that increased the reliability of refrigeration control. IT team equipped with guides, significantly reducing their dependency on external support. Build pipeline modernised from Ant to Maven."></p>
            </div>
        </section>
