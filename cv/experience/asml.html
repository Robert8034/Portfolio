            <p class="exp-period-label">08/2020 – 02/2021</p>
        </div>

    <main>
        <section class="exp-section">
            <div class="exp-block">
                <h2 data-nl="Situatie" data-en="Situation"></h2>
                <p data-nl="ASML is 's werelds toonaangevende fabrikant van lithografiemachines. Binnen de YieldStar-divisie (kwaliteitsmeetmachines voor wafers) was een terugkerend probleem: elke keer dat een nieuwe KPI aan het rapportagesysteem moest worden toegevoegd, kostte dat een developer gemiddeld twee weken. De oorzaak lag in de omvangrijke, sterk verouderde codebase waar elke KPI-toevoeging op meerdere plekken handmatige aanpassingen vereiste."
                   data-en="ASML is the world's leading manufacturer of lithography machines. Within the YieldStar division (quality measurement machines for wafers) there was a recurring problem: every time a new KPI needed to be added to the reporting system, it took a developer an average of two weeks. The cause was the large, heavily legacy codebase where each KPI addition required manual changes in multiple places."></p>
            </div>
            <div class="exp-block">
                <h2 data-nl="Rol & verantwoordelijkheden" data-en="Role & responsibilities"></h2>
                <p data-nl="Stage-opdracht: ontwerpen en bouwen van een Reporting Automation Tool (RAT) die het toevoegen van KPI's kon automatiseren. Dit was mijn eerste professionele softwareproject en mijn eerste ervaring met Scrum in een productieomgeving."
                   data-en="Internship assignment: design and build a Reporting Automation Tool (RAT) that could automate adding KPIs. This was my first professional software project and my first experience with Scrum in a production environment."></p>
            </div>
            <div class="exp-block">
                <h2 data-nl="Aanpak" data-en="Approach"></h2>
                <p data-nl="Ik ontwierp en bouwde RAT als een C#/WPF desktop-applicatie met template-gebaseerde codegeneratie. De tool genereerde automatisch de benodigde code voor nieuwe KPI's in alle rapportageformaten (CSV, ADEL, XML). Parallel refactorde ik de YieldStar-codebase zodat de gegenereerde code optimaal paste. Werkte in sprints van 2 weken met dagelijkse standups, sprint reviews en retrospectives."
                   data-en="I designed and built RAT as a C#/WPF desktop application with template-based code generation. The tool automatically generated the required code for new KPIs across all reporting formats (CSV, ADEL, XML). In parallel, I refactored the YieldStar codebase so the generated code fit optimally. Worked in 2-week sprints with daily standups, sprint reviews and retrospectives."></p>
            </div>
            <div class="exp-block">
                <h2 data-nl="Resultaat" data-en="Result"></h2>
                <p data-nl="RAT werd na de stage actief overgenomen door het Reporting-team. Doorlooptijd voor het toevoegen van een KPI teruggebracht van gemiddeld twee weken naar minuten. Foutmarge aanzienlijk verminderd door automatisering van handmatige, foutgevoelige stappen. Het project werd beoordeeld met een cum laude beoordeling."
                   data-en="RAT was adopted by the Reporting team after the internship. Lead time for adding a KPI reduced from an average of two weeks to minutes. Error margin significantly reduced by automating manual, error-prone steps. The project received a cum laude assessment."></p>
            </div>
        </section>
