            <h1 data-nl="Software Engineer & Scrum Master" data-en="Software Engineer & Scrum Master"></h1>

    <main>
        <section class="exp-section">
            <div class="exp-block">
                <h2 data-nl="Situatie" data-en="Situation"></h2>
                <p data-nl="PinkRoccade ontwikkelt software voor de Nederlandse publieke sector. Ik werk in het productteam aan iSuite Sociaal Portaal, een Blazor-gebaseerd SaaS-platform waarmee gemeenten sociale dienstverlening en uitkeringen beheren. Het platform vervangt een verouderd systeem en wordt van de grond af opgebouwd met .NET 8 en PostgreSQL."
                   data-en="PinkRoccade develops software for the Dutch public sector. I work in the product team on iSuite Sociaal Portaal, a Blazor-based SaaS platform that helps municipalities manage social services and welfare programs. The platform replaces a legacy system and is being built from the ground up with .NET 8 and PostgreSQL."></p>
            </div>
            <div class="exp-block">
                <h2 data-nl="Rol & verantwoordelijkheden" data-en="Role & responsibilities"></h2>
                <p data-nl="Dubbele rol in een Scrum-team van 6 (4 developers, 2 testers). Technisch: REST API's ontwerpen en implementeren, Blazor Server-componenten bouwen, databasemigraties beheren en code reviews uitvoeren. Als Scrum Master: sprint planning, refinement en retrospectives faciliteren, impediments oplossen en de samenwerking met het QA-team structureren."
                   data-en="Dual role in a 6-person Scrum team (4 developers, 2 testers). Technical: designing and implementing REST APIs, building Blazor Server components, managing database migrations and conducting code reviews. As Scrum Master: facilitating sprint planning, refinement and retrospectives, resolving impediments and structuring collaboration with the QA team."></p>
            </div>
            <div class="exp-block">
                <h2 data-nl="Aanpak" data-en="Approach"></h2>
                <p data-nl="Ik heb het QA-team geintegreerd in het sprintproces door testers vroegtijdig bij refinement te betrekken. Dit verkortte feedbackcycli van dagen naar uren. Technisch heb ik meerdere domain-specifieke API's ontworpen volgens clean architecture principes, met duidelijke scheiding tussen applicatie- en infrastructuurlagen. Daarnaast het Software Architecture-certificaat (Vijfhart) behaald om architectuurbeslissingen beter te onderbouwen."
                   data-en="I integrated the QA team into the sprint process by involving testers early in refinement. This shortened feedback cycles from days to hours. Technically, I designed multiple domain-specific APIs following clean architecture principles, with clear separation between application and infrastructure layers. Also obtained the Software Architecture certificate (Vijfhart) to better substantiate architecture decisions."></p>
            </div>
            <div class="exp-block">
                <h2 data-nl="Resultaat" data-en="Result"></h2>
                <p data-nl="Meerdere REST API's ontworpen en in productie voor 30+ gemeenten. QA-integratie in het sprintproces leidde tot kortere feedbackcycli en meetbaar minder productiefouten. De combinatie van PSM I-certificering en Software Architecture-certificaat versterkte mijn bijdrage aan zowel het proces als de technische richting van het team."
                   data-en="Multiple REST APIs designed and running in production for 30+ municipalities. QA integration into the sprint process led to shorter feedback cycles and measurably fewer production defects. The combination of PSM I certification and Software Architecture certificate strengthened my contribution to both the process and technical direction of the team."></p>
            </div>
        </section>
